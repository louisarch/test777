<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MrArch AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 40 40" class="logo-svg">
            <defs>
              <linearGradient id="archGrad" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#f0a868" />
                <stop offset="100%" stop-color="#b8452f" />
              </linearGradient>
            </defs>
            <path
              class="arch-path"
              pathLength="100"
              d="M8 34 V20 A12 12 0 0 1 32 20 V34"
              fill="none"
              stroke="url(#archGrad)"
              stroke-width="4.5"
              stroke-linecap="round"
            />
          </svg>
        </span>
        <span class="brand-name">MrArch AI</span>
      </div>

      <div class="model-picker" id="model-picker">
        <button type="button" class="model-picker-btn" id="model-picker-btn">
          <span class="model-picker-current" id="model-picker-current">Qwen2.5 Coder</span>
          <span class="model-picker-chevron">⌄</span>
        </button>

        <div class="model-picker-menu" id="model-picker-menu">
          <button type="button" class="model-option active" data-model="@cf/qwen/qwen2.5-coder-32b-instruct" data-label="Qwen2.5 Coder">
            <span class="model-option-text"><span class="model-option-brand">Qwen</span><span class="model-option-name">2.5 Coder</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/google/gemma-4-26b-a4b-it" data-label="Gemma 4">
            <span class="model-option-text"><span class="model-option-brand">Google</span><span class="model-option-name">Gemma 4</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/mistralai/mistral-small-3.1-24b-instruct" data-label="Mistral Small">
            <span class="model-option-text"><span class="model-option-brand">Mistral AI</span><span class="model-option-name">Small 3.1</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/nvidia/nemotron-3-120b-a12b" data-label="Nemotron 3">
            <span class="model-option-text"><span class="model-option-brand">NVIDIA</span><span class="model-option-name">Nemotron 3</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/meta/llama-3.3-70b-instruct-fp8-fast" data-label="Llama 3.3">
            <span class="model-option-text"><span class="model-option-brand">Meta</span><span class="model-option-name">Llama 3.3</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/deepseek-ai/deepseek-r1-distill-qwen-32b" data-label="DeepSeek R1">
            <span class="model-option-text"><span class="model-option-brand">DeepSeek</span><span class="model-option-name">R1 Distill</span></span>
            <span class="model-option-check">✓</span>
          </button>
          <button type="button" class="model-option" data-model="@cf/openai/gpt-oss-120b" data-label="GPT-OSS 120B">
            <span class="model-option-text"><span class="model-option-brand">OpenAI</span><span class="model-option-name">GPT-OSS 120B</span></span>
            <span class="model-option-check">✓</span>
          </button>
        </div>
      </div>
    </header>

    <main id="chat-window" class="chat-window">
      <div class="hero" id="hero">
        <h1>Ada yang bisa dibantu?</h1>
        <p>Tanya apa saja — jawabannya diproses lewat model AI yang kamu pilih di atas.</p>
        <div class="chip-row">
          <button type="button" class="chip">Jelaskan konsep OOP dengan analogi</button>
          <button type="button" class="chip">Buatkan IDE lengkap</button>
          <button type="button" class="chip">Review potongan kode</button>
          <button type="button" class="chip">Bikin draft email formal</button>
        </div>
      </div>
    </main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Tulis pesan..."
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn" class="send-btn" aria-label="Kirim">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
