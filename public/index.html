<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unikey — Chat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-orb"></span>
        <span class="brand-name">Unikey</span>
      </div>

      <div class="model-switch" id="model-switch" role="tablist" aria-label="Pilih model">
        <button type="button" class="model-btn active" data-model="kimi-k3">k3</button>
        <button type="button" class="model-btn" data-model="kimi-k2.7-code">k2.7-code</button>
        <button type="button" class="model-btn" data-model="kimi-k2.6">k2.6</button>
      </div>
    </header>

    <main id="chat-window" class="chat-window">
      <div class="hero" id="hero">
        <h1>Ada yang bisa dibantu?</h1>
        <p>Tanya apa saja — jawabannya diproses lewat model Kimi yang kamu pilih di atas.</p>
        <div class="chip-row">
          <button type="button" class="chip">Jelaskan konsep OOP dengan analogi</button>
          <button type="button" class="chip">Ide judul skripsi RPL</button>
          <button type="button" class="chip">Review potongan kode</button>
          <button type="button" class="chip">Bikin draft email formal</button>
        </div>
      </div>
    </main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="chat-input"
        class="chat-input"
        placeholder="Tulis pesan..."
        rows="1"
        autofocus
      ></textarea>
      <button type="submit" id="send-btn" class="send-btn" aria-label="Kirim">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 12L20 4L14 20L11 13L4 12Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
